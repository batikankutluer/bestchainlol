# =============================================================================
# Production stack.
#
#   doppler run --config prd -- docker compose -f docker-compose.prod.yml up -d
#
# Differences from the dev file that matter:
#   * backend, frontend and admin are containers here, not host processes
#   * the frontend bundles are baked into the nginx image at build time
#   * nothing publishes to 0.0.0.0 — cloudflared is the only ingress
#   * the backup job runs on its schedule and reports into Prometheus
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-bestchain}

x-restart: &restart
  restart: always

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: '20m'
      max-file: '5'

services:
  # ---------------------------------------------------------------- database --
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Consumed only by the init script that creates the least-privilege
      # role postgres_exporter logs in as.
      POSTGRES_MONITORING_PASSWORD: ${POSTGRES_MONITORING_PASSWORD}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-1536MB}
      - -c
      - log_min_duration_statement=1000
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Never published. The only way to reach it is from the data network.
    networks: [data]

  # ---------------------------------------------------------------- backend --
  backend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/backend:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      DATABASE_URL: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public&connection_limit=20'
      FRONTEND_URL: ${FRONTEND_URL}
      ADMIN_URL: ${ADMIN_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      OAUTH_GOOGLE_CLIENT_ID: ${OAUTH_GOOGLE_CLIENT_ID:-}
      OAUTH_GOOGLE_CLIENT_SECRET: ${OAUTH_GOOGLE_CLIENT_SECRET:-}
      OAUTH_GITHUB_CLIENT_ID: ${OAUTH_GITHUB_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      PROMETHEUS_URL: http://prometheus:9090/prometheus
      IMAGE_TAG: ${IMAGE_TAG:-latest}
      RUN_MIGRATIONS: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, app, observability]

  # ------------------------------------------------------------------- edge --
  nginx:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/nginx:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      target: prod
      args:
        # Baked into the JS bundles — changing these needs a rebuild, not a restart.
        API_URL: /api
        APP_DOMAIN: ${APP_DOMAIN}
        ADMIN_DOMAIN: ${ADMIN_DOMAIN}
        FRONTEND_URL: ${FRONTEND_URL}
        ADMIN_URL: ${ADMIN_URL}
    <<: [*restart, *logging]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER}
      NGINX_BASIC_AUTH_PASSWORD: ${NGINX_BASIC_AUTH_PASSWORD}
      UPSTREAM_BACKEND: backend:3000
      UPSTREAM_GRAFANA: grafana:3000
      UPSTREAM_BACKREST: backrest:9898
      UPSTREAM_PROMETHEUS: prometheus:9090
    ports:
      # Loopback only — for `curl -H "Host: ..."` debugging on the box itself.
      - '127.0.0.1:${NGINX_HTTP_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_started
      grafana:
        condition: service_started
    networks: [edge, app, observability]

  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    <<: [*restart, *logging]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token ${TUNNEL_TOKEN}
    depends_on: [nginx]
    # `edge` only. This is the whole point of the split: the process exposed to
    # the internet can reach nginx and nothing else — not Postgres, not
    # Prometheus, not the backup repository.
    networks: [edge, observability]

  # ---------------------------------------------------------------- metrics --
  prometheus:
    image: prom/prometheus:v2.55.1
    <<: [*restart, *logging]
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-90d}'
      - '--web.route-prefix=/prometheus'
      - '--web.external-url=${ADMIN_URL}/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - ./monitoring/prometheus/targets/prod:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    networks: [observability]

  grafana:
    image: grafana/grafana:11.3.1
    <<: [*restart, *logging]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_METRICS_ENABLED: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    <<: [*restart, *logging]
    environment:
      DATA_SOURCE_NAME: 'postgresql://monitoring:${POSTGRES_MONITORING_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable'
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, observability]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    <<: [*restart, *logging]
    command:
      - '--path.rootfs=/host'
    pid: host
    volumes:
      - /:/host:ro,rslave
    networks: [observability]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    <<: [*restart, *logging]
    command:
      - '--nginx.scrape-uri=http://nginx:8081/stub_status'
    depends_on: [nginx]
    networks: [observability]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    <<: [*restart, *logging]
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [observability]

  # ---------------------------------------------------------------- backups --
  backrest:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE}/backrest:${IMAGE_TAG:-latest}
    build:
      context: ./infra/backrest
    <<: [*restart, *logging]
    environment:
      BACKREST_PORT: 0.0.0.0:9898
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TZ: ${TZ:-UTC}
      # Read by the pg_dump hook, not by Backrest itself.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - backrest_config:/config
      - backrest_data:/data
      - backrest_cache:/cache
      # Where the hook writes and Backrest reads. Its own volume so a snapshot
      # never competes with the dump for the same filesystem as the repository.
      - backrest_dumps:/dumps
      - backrest_repos:/repos
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
  data:
    driver: bridge
    # No route off the host: the database plane never initiates outbound traffic.
    internal: true
  observability:
    driver: bridge

volumes:
  postgres_data:
  backrest_config:
  backrest_data:
  backrest_cache:
  backrest_dumps:
  backrest_repos:
  prometheus_data:
  grafana_data:
