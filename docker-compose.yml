# =============================================================================
# Development infrastructure.
#
#   terminal 1:  bun run dev
#   terminal 2:  docker compose up -d --build
#
# Once secrets exist, prefix both with `doppler run --`. Neither needs it to
# start: every value here has a development default.
#
# The apps (backend, frontend, admin) run on the HOST so hot reload is instant
# and the debugger attaches normally. Everything they depend on runs here, and
# nginx stitches the two halves together — so the URL you develop against has
# the same shape as production:
#
#   http://localhost:NGINX_HTTP_PORT       operations panel (also ADMIN_DOMAIN)
#   http://APP_DOMAIN:NGINX_HTTP_PORT      the public app
#
# Every value below has a development default, so a fresh clone runs with plain
# `docker compose up -d --build` and no secret manager at all. Those defaults
# are insecure on purpose and obvious on sight; `doppler run --` overrides every
# one of them. docker-compose.prod.yml has no defaults — a missing secret must
# fail there rather than quietly start something with a password of "app".
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-bestchain}

x-restart: &restart
  restart: unless-stopped

x-host-gateway: &host-gateway
  # Lets containers reach the dev servers running on the host. Docker Desktop
  # provides this name natively; on Linux the mapping below creates it.
  extra_hosts:
    - 'host.docker.internal:host-gateway'

services:
  # ---------------------------------------------------------------- database --
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      # Faster and safer than the default for a throwaway dev database.
      POSTGRES_INITDB_ARGS: '--data-checksums'
      # Consumed only by the init script that creates the least-privilege
      # role postgres_exporter logs in as.
      POSTGRES_MONITORING_PASSWORD: ${POSTGRES_MONITORING_PASSWORD:-monitoring}
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - max_connections=100
      - -c
      - log_min_duration_statement=500
    ports:
      # Published so the host-side backend and `prisma studio` can connect.
      - '${POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [data]

  # ------------------------------------------------------------------- edge --
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      target: dev
    <<: [*restart, *host-gateway]
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-app.localhost}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.app.localhost}
      NGINX_BASIC_AUTH_USER: ${NGINX_BASIC_AUTH_USER:-ops}
      NGINX_BASIC_AUTH_PASSWORD: ${NGINX_BASIC_AUTH_PASSWORD:-ops}
      # In dev every app upstream lives on the host.
      UPSTREAM_BACKEND: host.docker.internal:${BACKEND_PORT:-3100}
      UPSTREAM_FRONTEND: host.docker.internal:${FRONTEND_PORT:-5173}
      UPSTREAM_ADMIN: host.docker.internal:${ADMIN_PORT:-5174}
      UPSTREAM_GRAFANA: grafana:3000
      UPSTREAM_BACKREST: backrest:9898
      UPSTREAM_PROMETHEUS: prometheus:9090
    ports:
      - '${NGINX_HTTP_PORT:-8080}:80'
    depends_on:
      grafana:
        condition: service_started
      prometheus:
        condition: service_started
    networks: [edge, observability, data]

  # ---------------------------------------------------------------- metrics --
  # Renders the dev scrape target so Prometheus follows BACKEND_PORT instead of
  # a hardcoded 3000. Runs to completion, then Prometheus starts.
  prometheus-targets:
    image: alpine:3.20
    restart: 'no'
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-3100}
    command:
      - sh
      - -c
      - 'cp /src/*.yml /targets/ 2>/dev/null; sed "s/__BACKEND_PORT__/$$BACKEND_PORT/" /src/backend.yml.template > /targets/backend.yml && ls /targets'
    volumes:
      - ./monitoring/prometheus/targets/dev:/src:ro
      - prometheus_targets:/targets

  prometheus:
    image: prom/prometheus:v2.55.1
    <<: [*restart, *host-gateway]
    depends_on:
      prometheus-targets:
        condition: service_completed_successfully
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      # Served under a sub-path of the admin domain, so it must know its prefix
      # or every link it renders points at the wrong place.
      - '--web.route-prefix=/prometheus'
      - '--web.external-url=${ADMIN_URL:-http://admin.app.localhost:8080}/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'
    networks: [observability]

  grafana:
    image: grafana/grafana:11.3.1
    <<: *restart
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://admin.app.localhost:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_METRICS_ENABLED: 'true'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]
    networks: [observability]

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    <<: *restart
    environment:
      DATA_SOURCE_NAME: 'postgresql://monitoring:${POSTGRES_MONITORING_PASSWORD:-monitoring}@postgres:5432/${POSTGRES_DB:-app}?sslmode=disable'
      PG_EXPORTER_AUTO_DISCOVER_DATABASES: 'true'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, observability]

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    <<: *restart
    command:
      - '--nginx.scrape-uri=http://nginx:8081/stub_status'
    depends_on: [nginx]
    networks: [observability]

  # ---------------------------------------------------------------- backups --
  backrest:
    build:
      context: ./infra/backrest
    <<: *restart
    environment:
      BACKREST_PORT: 0.0.0.0:9898
      BACKREST_DATA: /data
      BACKREST_CONFIG: /config/config.json
      XDG_CACHE_HOME: /cache
      TZ: ${TZ:-UTC}
      # Read by the pg_dump hook, not by Backrest itself.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - backrest_config:/config
      - backrest_data:/data
      - backrest_cache:/cache
      # Where the hook writes and Backrest reads. Its own volume so a snapshot
      # never competes with the dump for the same filesystem as the repository.
      - backrest_dumps:/dumps
      - backrest_repos:/repos
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  # ----------------------------------------------------------------- tunnel --
  cloudflared:
    image: cloudflare/cloudflared:2025.9.1
    <<: *restart
    # Off by default in dev: `docker compose --profile tunnel up -d` to expose
    # a local stack through a real hostname (useful for wallet callback testing).
    profiles: [tunnel]
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run --token ${TUNNEL_TOKEN:-}
    depends_on: [nginx]
    networks: [edge]

# -----------------------------------------------------------------------------
# Network split. The rule that matters: `cloudflared` sits only on `edge`, so
# the one process reachable from the internet can reach nothing but nginx.
# -----------------------------------------------------------------------------
networks:
  edge:
    driver: bridge
  data:
    driver: bridge
  observability:
    driver: bridge

volumes:
  postgres_data:
  backrest_config:
  backrest_data:
  backrest_cache:
  backrest_dumps:
  backrest_repos:
  prometheus_targets:
  prometheus_data:
  grafana_data:
