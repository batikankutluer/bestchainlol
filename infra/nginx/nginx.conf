user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # $upstream_response_time is what makes a slow backend distinguishable from a
  # slow client in the access log.
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                  'rt=$request_time urt="$upstream_response_time"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 10m;

  # nginx builds its automatic trailing-slash redirects from $host and the port
  # it is listening on — 80 — which drops the :8080 of a port-mapped dev setup
  # and downgrades https to http behind the tunnel. A relative Location lets the
  # browser resolve it against the origin it actually used.
  absolute_redirect off;

  # Defaults; individual locations override where they need to.
  proxy_connect_timeout 5s;
  proxy_send_timeout    60s;
  proxy_read_timeout    60s;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript application/json
             application/wasm image/svg+xml;

  # Cloudflared terminates TLS and forwards over the edge network, so the real
  # client IP arrives in a header rather than on the socket.
  real_ip_header CF-Connecting-IP;
  set_real_ip_from 0.0.0.0/0;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Only the metrics exporter reads this; it is never exposed through the tunnel.
  server {
    listen 8081;
    server_name _;
    location /stub_status {
      stub_status;
      access_log off;
    }
  }

  include /etc/nginx/conf.d/*.conf;
}
