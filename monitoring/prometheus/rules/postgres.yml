groups:
  - name: postgres
    rules:
      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: 'PostgreSQL is not reachable by the exporter'
          description: 'pg_up has been 0 for 1m. Every write path is down.'

      - alert: PostgresConnectionsNearLimit
        expr: >
          sum(pg_stat_activity_count) /
          on() group_left() max(pg_settings_max_connections) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 'PostgreSQL connections above 80% of max_connections'
          description: 'Connection exhaustion shows up as request timeouts, not database errors.'

      - alert: PostgresLowCacheHitRatio
        expr: >
          sum(rate(pg_stat_database_blks_hit[10m])) /
          clamp_min(sum(rate(pg_stat_database_blks_hit[10m])) +
                    sum(rate(pg_stat_database_blks_read[10m])), 1) < 0.9
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: 'Buffer cache hit ratio below 90%'
          description: 'Either the working set outgrew shared_buffers or a query is scanning.'

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: 'Deadlocks detected'
          description: 'The settlement writer takes locks in more than one order somewhere.'
