apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    # Prometheus runs with --web.route-prefix=/prometheus so it can be served
    # under a sub-path of the admin domain; its API lives under that prefix too.
    url: http://prometheus:9090/prometheus
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST
    editable: false
