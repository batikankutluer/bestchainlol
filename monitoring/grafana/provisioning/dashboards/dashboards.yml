apiVersion: 1

providers:
  - name: bestchain
    orgId: 1
    folder: bestchain
    type: file
    disableDeletion: true
    # Dashboards are code: edits made in the UI are overwritten on restart.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
